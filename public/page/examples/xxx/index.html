<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulsefield | easy-three</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
        "@masabando/easy-three": "https://cdn.jsdelivr.net/gh/masabando/easy-three@1.15.0/dist/easy-three.js",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
        "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"
      }
    }
  </script>
</head>

<body>
  <script type="module">
    import { init } from "@masabando/easy-three";
    const { create, camera, animate, controls, scene, color } = init();

    camera.position.set(10, 30, 30);
    controls.connect();

    create.ambientLight();
    create.directionalLight();

    scene.background = color("#222222");

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    const roadSize = [10, 50];
    const roadResolution = 10;

    const parts = {
      circle: Array.from({ length: 10}, () => ({
        position: [random(0, roadSize[0]*roadResolution), random(0, roadSize[1]*roadResolution)],
        size: random(20, 100),
        color: `hsl(${random(0, 360)}, 100%, 50%)`
      }))
    }

    const draw = {
      circle: (ctx, canvas, idx) => {
        const c = parts.circle[idx];
        ctx.lineWidth = 5;
        ctx.strokeStyle = c.color;
        ctx.beginPath();
        ctx.arc(c.position[0], c.position[1], c.size, 0, Math.PI * 2);
        ctx.stroke();
      }
    }


    const road = create.canvas((ctx, canvas) => {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }, {
      size: roadSize,
      rotation: [-Math.PI/2, 0, 0],
      resolution: 10,
      material: "Physical",
    })
    road.updateTexture = (time) => {
      road.update((ctx, canvas) => {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        parts.circle.forEach((_, idx) => {
          draw.circle(ctx, canvas, idx);
        })
      })
    };

    animate(({ time }) => {
      road.updateTexture(time);
    })
  </script>
</body>

</html>
