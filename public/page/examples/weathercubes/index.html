<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Cubes | easy-three</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
        "@masabando/easy-three": "https://cdn.jsdelivr.net/gh/masabando/easy-three@1.15.0/dist/easy-three.js",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
        "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #0f172a; overflow: hidden; }
  </style>
</head>

<body>
  <script type="module">
    import { init } from "@masabando/easy-three";

    const { camera, create, animate, controls, scene, color } = init();

    scene.background = color("#0f172a");
    create.fog({ color: "#0f172a", near: 4, far: 13 });
    camera.position.set(4.4, 3.1, 5.4);
    camera.lookAt(0, 0.6, 0);
    controls.connect();

    create.ambientLight({ intensity: 1.2, color: 0x93c5fd });
    create.directionalLight({ intensity: 2.4, color: 0xffffff, position: [3, 6, 4] });

    create.plane({
      size: [8, 8],
      rotation: [-Math.PI / 2, 0, 0],
      position: [0, -0.04, 0],
      material: "Basic",
      option: { color: 0x16213d },
    });

    const systems = [
      { name: "RAIN", x: -2.4, color: "#38bdf8", speed: 2.9 },
      { name: "SNOW", x: 0, color: "#e0f2fe", speed: 1.1 },
      { name: "WIND", x: 2.4, color: "#bef264", speed: 2.0 },
    ];

    const particles = [];
    systems.forEach((system) => {
      const title = create.text(system.name, {
        size: [1.25, 0.34],
        position: [system.x, 2.25, -1.5],
        fontSize: 58,
        fontWeight: "800",
        resolution: 2,
        color: system.color,
      });
      title.userData = { system };

      for (let i = 0; i < 45; i++) {
        const isWind = system.name === "WIND";
        const p = create.cube({
          size: isWind ? [0.34, 0.035, 0.035] : [0.06, 0.16, 0.06],
          position: [
            system.x + Math.random() * 1.5 - 0.75,
            Math.random() * 2.9,
            Math.random() * 2.6 - 1.3,
          ],
          rotation: [0, 0, isWind ? 0.5 : 0],
          material: "Basic",
          option: {
            color: system.color,
            transparent: true,
            opacity: 0.45 + Math.random() * 0.45,
          },
        });
        p.userData = {
          system,
          phase: Math.random() * Math.PI * 2,
          drift: Math.random() * 0.5 + 0.2,
        };
        particles.push(p);
      }
    });

    animate(({ time, delta }) => {
      particles.forEach((p) => {
        const system = p.userData.system;
        if (system.name === "RAIN") {
          p.position.y -= delta * system.speed;
          p.position.x += Math.sin(time * 2 + p.userData.phase) * delta * 0.25;
          if (p.position.y < 0) p.position.y = 2.9;
        }
        if (system.name === "SNOW") {
          p.position.y -= delta * system.speed;
          p.position.x += Math.sin(time + p.userData.phase) * delta * 0.35;
          p.rotation.y += delta * 1.5;
          if (p.position.y < 0) p.position.y = 2.9;
        }
        if (system.name === "WIND") {
          p.position.x += delta * system.speed;
          p.position.y += Math.sin(time * 2.3 + p.userData.phase) * delta * 0.18;
          p.rotation.z = Math.sin(time * 1.6 + p.userData.phase) * 0.5;
          if (p.position.x > system.x + 0.9) p.position.x = system.x - 0.9;
        }
      });
    });
  </script>
</body>

</html>
