<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Lanterns | easy-three</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
        "@masabando/easy-three": "https://cdn.jsdelivr.net/gh/masabando/easy-three@1.15.0/dist/easy-three.js",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
        "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #10070a; overflow: hidden; }
  </style>
</head>

<body>
  <script type="module">
    import { init } from "@masabando/easy-three";

    const { camera, create, animate, controls, scene, color } = init();

    scene.background = color("#10070a");
    create.fog({ color: "#10070a", near: 3, far: 12 });
    camera.position.set(0, 2.3, 6);
    camera.lookAt(0, 1, 0);
    controls.connect();

    create.ambientLight({ intensity: 0.6, color: 0xffb05e });
    create.directionalLight({ intensity: 1.2, color: 0xfff0c0, position: [0, 5, 3] });

    const water = create.canvas((ctx, canvas) => {
      ctx.fillStyle = "#12080d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }, {
      size: [9, 7],
      resolution: 80,
      rotation: [-Math.PI / 2, 0, 0],
      position: [0, -0.05, 0],
    });

    water.updateWater = (time) => {
      water.update((ctx, canvas) => {
        ctx.fillStyle = "rgba(18, 8, 13, 0.18)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 8; i++) {
          const y = ((time * 30 + i * 70) % canvas.height);
          ctx.strokeStyle = `rgba(255, ${130 + i * 8}, 70, 0.12)`;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.bezierCurveTo(canvas.width * 0.3, y - 20, canvas.width * 0.7, y + 20, canvas.width, y);
          ctx.stroke();
        }
      });
    };

    function makeLanternTexture(label, hue) {
      return create.textTexture(label, {
        size: [180, 240],
        fontSize: 54,
        fontWeight: "700",
        color: `hsl(${hue}, 100%, 18%)`,
        background: `hsla(${hue}, 100%, 72%, 0.95)`,
        guide: 12,
        guideColor: `hsla(${hue + 20}, 100%, 85%, 0.7)`,
      });
    }

    const labels = ["灯", "星", "夢", "風", "月", "旅", "光", "宙"];
    const lanterns = labels.map((label, i) => {
      const hue = 28 + i * 14;
      const lantern = create.cube({
        size: [0.55, 0.75, 0.55],
        position: [
          Math.sin(i * 1.7) * 2.9,
          0.55 + Math.random() * 1.8,
          -2.4 + Math.cos(i * 1.3) * 1.7,
        ],
        material: "Basic",
        option: {
          map: makeLanternTexture(label, hue),
          transparent: true,
          opacity: 0.92,
        },
      });
      lantern.userData = {
        baseY: lantern.position.y,
        phase: i * 0.75,
        hue,
      };
      return lantern;
    });

    const reflections = lanterns.map((lantern) => create.plane({
      size: [0.6, 0.16],
      rotation: [-Math.PI / 2, 0, 0],
      position: [lantern.position.x, 0.01, lantern.position.z],
      material: "Basic",
      option: {
        color: `hsl(${lantern.userData.hue}, 100%, 60%)`,
        transparent: true,
        opacity: 0.35,
      },
    }));

    animate(({ time, delta }) => {
      water.updateWater(time);
      lanterns.forEach((lantern, i) => {
        const lift = Math.sin(time * 0.9 + lantern.userData.phase);
        lantern.position.y = lantern.userData.baseY + lift * 0.12;
        lantern.rotation.y += delta * (0.18 + i * 0.01);
        lantern.rotation.z = Math.sin(time * 0.7 + i) * 0.04;
        reflections[i].position.x = lantern.position.x;
        reflections[i].position.z = lantern.position.z;
        reflections[i].scale.x = 1 + Math.abs(lift) * 0.8;
        reflections[i].material.opacity = 0.2 + Math.max(0, lift) * 0.2;
      });
    });
  </script>
</body>

</html>
