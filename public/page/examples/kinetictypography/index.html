<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Typography | easy-three</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
        "@masabando/easy-three": "https://cdn.jsdelivr.net/gh/masabando/easy-three@1.15.0/dist/easy-three.js",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
        "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #f8f7f2; overflow: hidden; }
  </style>
</head>

<body>
  <script type="module">
    import { init } from "@masabando/easy-three";

    const { camera, create, animate, controls, scene, color } = init();

    scene.background = color("#f8f7f2");
    camera.position.set(0, 0.4, 6);
    camera.lookAt(0, 0, 0);
    controls.connect();

    create.ambientLight({ intensity: 2 });
    create.directionalLight({ intensity: 2, position: [2, 3, 3] });

    const words = [
      ["EASY", -1.95, 0.72, "#111827", 1.55],
      ["3D", 1.3, 0.02, "#ef4444", 1.78],
      ["MOTION", -0.35, -0.86, "#2563eb", 1.2],
      ["TEXT", 1.8, 1.0, "#059669", 0.78],
      ["CANVAS", -2.0, -0.15, "#f59e0b", 0.86],
    ];

    const meshes = words.map(([label, x, y, col, size], i) => {
      const text = create.text(label, {
        size: [size * 2.1, size * 0.62],
        position: [x, y, -i * 0.05],
        fontSize: 70,
        fontWeight: "900",
        color: col,
        background: "rgba(255,255,255,0)",
        resolution: 2,
      });
      text.userData = { x, y, i, col };
      return text;
    });

    const bars = [];
    for (let i = 0; i < 12; i++) {
      bars.push(create.cube({
        size: [0.05 + (i % 3) * 0.04, 0.12 + i * 0.02, 0.04],
        position: [-3.2 + i * 0.58, -1.65, -0.4],
        material: "Basic",
        option: { color: i % 2 ? "#111827" : "#ef4444" },
      }));
    }

    animate(({ time, delta }) => {
      meshes.forEach((mesh) => {
        const p = time * 1.7 + mesh.userData.i * 0.8;
        mesh.position.x = mesh.userData.x + Math.sin(p) * 0.18;
        mesh.position.y = mesh.userData.y + Math.cos(p * 0.9) * 0.12;
        mesh.rotation.z = Math.sin(p * 0.7) * 0.08;
        mesh.scale.setScalar(1 + Math.sin(p * 1.4) * 0.04);
      });
      bars.forEach((bar, i) => {
        bar.rotation.z += delta * (0.9 + i * 0.04);
        bar.scale.y = 1 + Math.max(0, Math.sin(time * 3 + i * 0.7)) * 3;
      });
    });
  </script>
</body>

</html>
