<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Jelly | easy-three</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
        "@masabando/easy-three": "https://cdn.jsdelivr.net/gh/masabando/easy-three@1.15.0/dist/easy-three.js",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.10/build/index.module.js",
        "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      background: #020713;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <script type="module">
    import { init } from "@masabando/easy-three";

    const { camera, create, animate, controls, scene, color, THREE } = init();

    scene.background = color("#020713");
    create.fog({
      color: "#020713",
      near: 3,
      far: 13,
    });

    camera.position.set(0, 2.5, -6.5);
    camera.lookAt(0, 0.7, 0);
    controls.connect();
    controls.target.set(0, 0.8, 0);

    create.ambientLight({
      intensity: 1.4,
      color: 0x87f5ff,
    });
    create.directionalLight({
      intensity: 1.8,
      color: 0xaeefff,
      position: [2, 5, 4],
    });

    function makeGlowTexture(hue) {
      return create.canvasTexture((ctx, canvas) => {
        const gradient = ctx.createRadialGradient(
          canvas.width / 2,
          canvas.height / 2,
          8,
          canvas.width / 2,
          canvas.height / 2,
          canvas.width / 2,
        );
        gradient.addColorStop(0, `hsla(${hue}, 100%, 76%, 0.95)`);
        gradient.addColorStop(0.35, `hsla(${hue + 25}, 100%, 58%, 0.45)`);
        gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }, {
        size: [256, 256],
      });
    }

    const glowTexture = makeGlowTexture(185);
    const bloomSheets = [];
    for (let i = 0; i < 7; i++) {
      bloomSheets.push(create.plane({
        size: [2.6 + i * 0.6, 2.6 + i * 0.6],
        position: [
          Math.sin(i * 1.7) * 2.1,
          0.5 + Math.cos(i * 1.2) * 1.2,
          -2.8 - i * 0.45,
        ],
        rotation: [0, 0, i * 0.4],
        doubleSide: true,
        material: "Basic",
        option: {
          map: glowTexture,
          transparent: true,
          opacity: 0.22,
          depthWrite: false,
        },
      }));
    }

    function createTentacle({
      root,
      angle,
      length,
      hue,
      radius,
    }) {
      const points = [];
      const wave = Math.sin(angle * 3.1) * 0.18;
      for (let i = 0; i < 6; i++) {
        const t = i / 5;
        points.push(new THREE.Vector3(
          Math.cos(angle) * radius * (1 - t * 0.35) + Math.sin(t * Math.PI * 2) * wave,
          -t * length,
          Math.sin(angle) * radius * (1 - t * 0.35) + Math.cos(t * Math.PI * 2) * wave,
        ));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const tube = create.object(THREE.TubeGeometry, {
        args: [curve, 48, 0.012, 8, false],
        material: "Basic",
        option: {
          color: `hsl(${hue}, 100%, 72%)`,
          transparent: true,
          opacity: 0.65,
        },
        autoAdd: false,
      });
      root.add(tube);
      return tube;
    }

    function createJelly({
      position,
      size = 1,
      hue = 185,
      offset = 0,
    }) {
      const root = create.group({ position });

      const bell = create.sphere({
        size,
        segments: [48, 24],
        material: "Physical",
        option: {
          color: `hsl(${hue}, 100%, 70%)`,
          transparent: true,
          opacity: 0.58,
          roughness: 0.08,
          metalness: 0,
          transmission: 0.72,
          thickness: 1.5,
        },
        autoAdd: false,
      });
      bell.scale.set(1, 0.38, 1);
      bell.position.y = 0.2;
      root.add(bell);

      const rim = create.torus({
        size: size * 0.72,
        tube: size * 0.018,
        rotation: [Math.PI / 2, 0, 0],
        material: "Basic",
        option: {
          color: `hsl(${hue + 25}, 100%, 62%)`,
          transparent: true,
          opacity: 0.8,
        },
        autoAdd: false,
      });
      rim.position.y = -size * 0.05;
      root.add(rim);

      const core = create.sphere({
        size: size * 0.16,
        material: "Basic",
        option: {
          color: `hsl(${hue + 55}, 100%, 74%)`,
          transparent: true,
          opacity: 0.85,
        },
        autoAdd: false,
      });
      core.position.y = 0.12;
      root.add(core);

      const tentacles = [];
      for (let i = 0; i < 14; i++) {
        tentacles.push(createTentacle({
          root,
          angle: (Math.PI * 2 * i) / 14,
          length: size * (1.05 + (i % 4) * 0.18),
          hue: hue + i * 3,
          radius: size * 0.5,
        }));
      }

      root.userData = {
        base: position.slice(),
        offset,
        size,
        bell,
        rim,
        core,
        tentacles,
      };
      return root;
    }

    const jellies = [
      createJelly({ position: [-1.7, 1.1, -0.4], size: 0.9, hue: 185, offset: 0.1 }),
      createJelly({ position: [1.25, 1.45, -1.0], size: 0.72, hue: 220, offset: 1.3 }),
      createJelly({ position: [0.05, 0.45, 0.6], size: 0.55, hue: 300, offset: 2.2 }),
      createJelly({ position: [-2.4, 0.1, -1.8], size: 0.48, hue: 145, offset: 3.1 }),
      createJelly({ position: [2.25, 0.4, -2.2], size: 0.52, hue: 40, offset: 4.0 }),
    ];

    const bubbles = [];
    for (let i = 0; i < 90; i++) {
      const bubble = create.sphere({
        size: 0.018 + Math.random() * 0.035,
        position: [
          Math.random() * 6 - 3,
          Math.random() * 4 - 1.5,
          Math.random() * -4,
        ],
        material: "Basic",
        option: {
          color: 0x9df7ff,
          transparent: true,
          opacity: 0.22 + Math.random() * 0.38,
        },
      });
      bubble.userData = {
        speed: 0.18 + Math.random() * 0.28,
        phase: Math.random() * Math.PI * 2,
      };
      bubbles.push(bubble);
    }

    animate(({ time, delta }) => {
      bloomSheets.forEach((sheet, i) => {
        sheet.rotation.z += delta * (0.025 + i * 0.006);
        sheet.material.opacity = 0.13 + Math.sin(time * 0.8 + i) * 0.04;
      });

      jellies.forEach((jelly) => {
        const { base, offset, size, bell, rim, core, tentacles } = jelly.userData;
        const pulse = Math.sin(time * 2.2 + offset) * 0.5 + 0.5;
        jelly.position.x = base[0] + Math.sin(time * 0.45 + offset) * 0.28;
        jelly.position.y = base[1] + Math.sin(time * 0.85 + offset) * 0.22;
        jelly.rotation.y += delta * (0.18 + size * 0.08);

        bell.scale.set(1 + pulse * 0.06, 0.34 + pulse * 0.1, 1 + pulse * 0.06);
        rim.scale.setScalar(1 + pulse * 0.08);
        core.scale.setScalar(1 + pulse * 0.6);
        tentacles.forEach((tentacle, i) => {
          tentacle.rotation.y = Math.sin(time * 1.4 + offset + i) * 0.16;
          tentacle.scale.y = 0.9 + pulse * 0.22;
        });
      });

      bubbles.forEach((bubble) => {
        bubble.position.y += delta * bubble.userData.speed;
        bubble.position.x += Math.sin(time + bubble.userData.phase) * delta * 0.06;
        if (bubble.position.y > 2.7) {
          bubble.position.y = -1.6;
        }
      });
    });
  </script>
</body>

</html>
